services:
  app:
    image: evershop/evershop:latest
    restart: always
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_PASSWORD: postgres
      DB_USER: postgres
      DB_NAME: postgres
    networks:
      - myevershop
    depends_on:
      - database
    ports:
      - 3000:3000
    volumes:
      - ./config:/app/config:ro
      - ./seed/categories.json:/app/node_modules/@evershop/evershop/dist/bin/seed/data/categories.json:ro
      - ./seed/collections.json:/app/node_modules/@evershop/evershop/dist/bin/seed/data/collections.json:ro
      - ./seed/attributes-goalbox.json:/app/node_modules/@evershop/evershop/dist/bin/seed/data/attributes.json:ro
      - ./seed/pages-goalbox.json:/app/node_modules/@evershop/evershop/dist/bin/seed/data/pages.json:ro
      - ./seed/products-meal-prep-30.json:/app/node_modules/@evershop/evershop/dist/bin/seed/data/products.json:ro
      - ./seed/widgets-goalbox.json:/app/node_modules/@evershop/evershop/dist/bin/seed/data/widgets.json:ro
      - ./seed/images:/app/media/catalog/custom:ro
      - ./seed/images/about-hero-goalbox-v2.jpg:/app/public/images/about-hero-goalbox-v2.jpg:ro
      - ./seed/images/about-kitchen-team-goalbox-v2.jpg:/app/public/images/about-kitchen-team-goalbox-v2.jpg:ro
      - ./seed/images/about-macro-detail-goalbox-v2.jpg:/app/public/images/about-macro-detail-goalbox-v2.jpg:ro
      - ./seed/images/about-lifestyle-cta-goalbox-v2.jpg:/app/public/images/about-lifestyle-cta-goalbox-v2.jpg:ro
      - ./seed/images/branding:/app/public/images/branding:ro
      - ./seed/images/branding/goalbox-favicon-set.jpg:/app/public/favicon.ico:ro
      # Patch EverShop migration to skip default Men/Women/Kids categories
      - ./packages/evershop/dist/modules/catalog/migration/Version-1.0.0.js:/app/node_modules/@evershop/evershop/dist/modules/catalog/migration/Version-1.0.0.js:ro
      # Admin product grid with GoalBox collection filter
      - ./packages/evershop/dist/modules/catalog/pages/admin/productGrid/Grid.js:/app/node_modules/@evershop/evershop/dist/modules/catalog/pages/admin/productGrid/Grid.js:ro
      - ./packages/evershop/dist/modules/catalog/services/registerDefaultProductCollectionFilters.js:/app/node_modules/@evershop/evershop/dist/modules/catalog/services/registerDefaultProductCollectionFilters.js:ro

  #The postgres database: 
  database:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./seed/db-init:/docker-entrypoint-initdb.d:ro
      # Files are executed alphabetically: 01 image-trigger, 02 store-settings, 03 coupons
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    networks:
      - myevershop

networks:
  myevershop:
    name: MyEverShop
    driver: bridge

volumes:
  postgres-data:
